<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Nexus — шапка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<header style="width: 1160px; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: #0f1218; border-bottom: 1px solid #05070a; font-family: 'Segoe UI', system-ui, sans-serif; color: #e6edf5; font-size: 14px">
<button type="button" style="height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; border: 1px solid #2d3644; background: #1a2029; color: #e6edf5; font: inherit; font-weight: 600">
<span style="width: 20px; height: 20px; border-radius: 6px; background: #2ec4ff; color: #0f1218; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">Т</span>Тестовый сервер
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b97a8" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<label for="cmd" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Поиск и команды</label>
<div style="width: 440px; height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 8px; border: 1px solid #2d3644; background: #1a2029">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b97a8" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="cmd" placeholder="Участник, канал или команда: «мут @ник 1ч»" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #e6edf5; font: inherit; outline: none">
<span style="font-size: 11px; color: #8b97a8; border: 1px solid #2d3644; border-radius: 4px; padding: 1px 5px">Ctrl K</span>
</div>
<div style="flex: 1"></div>
<sc-if value="{{off}}" hint-placeholder-val="{{ true }}">
<button type="button" style="height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; border: 1px solid #2d3644; background: transparent; color: #c7d1dd; font: inherit">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Lockdown</button>
</sc-if>
<sc-if value="{{on}}" hint-placeholder-val="{{ false }}">
<button type="button" style="height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; border: 0; background: #ff5d5d; color: #0f1218; font: inherit; font-weight: 700">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Сервер закрыт</button>
</sc-if>
<span style="display: flex; align-items: center; gap: 6px; color: #c7d1dd; font-size: 13px; padding: 0 4px"><span style="width: 8px; height: 8px; border-radius: 50%; background: #3ccf8e"></span>Бот на связи</span>
<button type="button" aria-label="Уведомления, 2 новых" style="position: relative; width: 36px; height: 36px; border-radius: 8px; border: 1px solid #2d3644; background: transparent; color: #c7d1dd; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
<span style="position: absolute; top: 5px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #ff7a1a; box-shadow: 0 0 0 2px #0f1218"></span>
</button>
<span style="width: 32px; height: 32px; border-radius: 50%; background: #5865f2; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">F</span>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lockdown":{"editor":"boolean","default":false},"$preview":{"width":1160,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    const on = !!this.props.lockdown;
    return { on: on, off: !on };
  }
}
</script>
</body>
</html>
