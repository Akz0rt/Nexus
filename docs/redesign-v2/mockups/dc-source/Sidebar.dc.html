<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Nexus — меню</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Разделы" style="width: 240px; height: 900px; box-sizing: border-box; background: #131820; border-right: 1px solid #05070a; padding: 18px 12px 16px; display: flex; flex-direction: column; gap: 4px; font-family: 'Segoe UI', system-ui, sans-serif; color: #e6edf5; font-size: 14px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 14px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50" fill="#0f1218"></circle><g stroke="#0f1218" stroke-width="2.5" stroke-linejoin="round"><polygon points="50,19 77,34.5 50,50 23,34.5" fill="#8AE6FF"></polygon><polygon points="77,34.5 77,65.5 50,81 50,50" fill="#2EC4FF"></polygon><polygon points="23,34.5 50,50 50,81 23,65.5" fill="#1468C2"></polygon></g><polygon points="50,36 62.1,43 62.1,57 50,64 37.9,57 37.9,43" fill="#0f1218"></polygon><polygon points="50,39.5 59.1,44.75 59.1,55.25 50,60.5 40.9,55.25 40.9,44.75" fill="none" stroke="#FF7A1A" stroke-width="2.5"></polygon><circle cx="50" cy="50" r="5" fill="#FFB020"></circle></svg>
<span style="font-weight: 700; font-size: 15px">Nexus</span>
</div>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 2px; padding-bottom: 10px">
<span style="font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8b97a8; padding: 6px 10px 4px">{{g.label}}</span>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
<a href="#" style="display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border-radius: 8px; text-decoration: none; color: {{it.color}}; background: {{it.bg}}; box-shadow: {{it.ring}}; font-weight: {{it.weight}}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.d}}"></path></svg>
<span style="flex: 1">{{it.label}}</span>
<sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{ false }}">
<span style="min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; background: #ff7a1a; color: #0f1218; font-size: 11px; font-weight: 700; clip-path: polygon(22% 0, 78% 0, 100% 50%, 78% 100%, 22% 100%, 0 50%)">{{it.badge}}</span>
</sc-if>
</a>
</sc-for>
</div>
</sc-for>
<div style="margin-top: auto; border-top: 1px solid #2d3644; padding: 12px 10px 0; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8b97a8">На смене</span>
<div style="display: flex; align-items: center; gap: 6px">
<span style="width: 22px; height: 22px; border-radius: 50%; background: #5865f2; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">F</span>
<span style="width: 22px; height: 22px; border-radius: 50%; background: #e84393; font-size: 10px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; margin-left: -10px; box-shadow: 0 0 0 2px #131820">K</span>
<span style="font-size: 13px; color: #c7d1dd; margin-left: 4px">Flix, Kira</span>
</div>
<span style="font-size: 12px; color: #8b97a8">v1.0.0 · обновлено</span>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","queue","voice","moderation","roles","events","birthdays","economy","activity","stats","journal","settings"],"default":"overview"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'overview';
    const P = {
      overview: 'M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z',
      queue: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM16 11l2 2 4-4',
      voice: 'M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2M12 19v3',
      moderation: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
      roles: 'M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8zM7 7h.01',
      events: 'M3 4h18v17H3zM16 2v4M8 2v4M3 10h18',
      birthdays: 'M20 12v9H4v-9M2 7h20v5H2zM12 21V7M12 7S10 3 7.5 3a2.5 2.5 0 0 0 0 4H12zM12 7s2-4 4.5-4a2.5 2.5 0 0 1 0 4H12z',
      economy: 'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2',
      activity: 'M3 3v18h18M7 14l4-4 4 4 5-6',
      stats: 'M18 20V10M12 20V4M6 20v-6',
      journal: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h5',
      settings: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1'
    };
    const mk = (id, label, badge) => {
      const on = id === active;
      return { label: label, d: P[id], hasBadge: !!badge, badge: badge || '', color: on ? '#e6edf5' : '#aeb9c7', bg: on ? '#222a35' : 'transparent', ring: on ? 'inset 3px 0 0 #2ec4ff' : 'none', weight: on ? '600' : '400' };
    };
    return {
      groups: [
        { label: 'Каждый день', items: [mk('overview', 'Обзор'), mk('queue', 'Пропуск', '7'), mk('voice', 'Голосовые'), mk('moderation', 'Модерация', '1')] },
        { label: 'Сообщество', items: [mk('roles', 'Роли'), mk('events', 'Ивенты'), mk('birthdays', 'Дни рождения'), mk('economy', 'Экономика')] },
        { label: 'Данные', items: [mk('activity', 'Активность'), mk('stats', 'Статистика'), mk('journal', 'Журнал')] },
        { label: 'Сервер', items: [mk('settings', 'Настройки')] }
      ]
    };
  }
}
</script>
</body>
</html>
