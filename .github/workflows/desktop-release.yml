# Builds the desktop panel installer and publishes it as a GitHub Release.
# Trigger: push a tag like desktop-v0.2.0. Independent of the bot deploy
# (main_birthday-bot.yml runs only on pushes to main, never on tags).
# The installed app auto-updates from releases/latest/download/latest.yml.

name: Desktop panel release

on:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: write # create the release and upload assets

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like desktop-v1.2.3, got $GITHUB_REF_NAME" >&2
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installer
        run: npm run dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            "release/BirthdayBot-Panel-Setup-$VERSION.exe" \
            "release/BirthdayBot-Panel-Setup-$VERSION.exe.blockmap" \
            release/latest.yml \
            --title "BirthdayBot Panel $VERSION" \
            --notes "Установщик панели модераторов для Windows: скачайте BirthdayBot-Panel-Setup-$VERSION.exe и запустите. Уже установленное приложение обновится само." \
            --latest
